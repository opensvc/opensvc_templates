# An sftp server: one account per user, each locked in a directory of its
# own, signing in with a ssh key only. See README.md.

[DEFAULT]
nodes = {clusternodes}
orchestrate = ha
netns = container#0
rm = true

[ip#1]
type = netns
network = default

# Everything the server keeps, following it from node to node, in a volume
# shared between them:
# /sftproot   the files of the users, /sftproot/<user>/upload
# /hostkeys   the ssh host keys, made at the first start
# /sftp       installed from the cfg: the sshd configuration, the keys of the
#             users and the script laying out their directories
# /mirror     the same, for the optional read-only mirror endpoint
[volume#1]
name = {name}-data
size = 10g
# From a pool shared between the nodes, a drbd one for example.
shared = true
install = /sftproot/
    /hostkeys/ mode 0700
    /sftp/sshd_config from ./cfg/{name} key sshd_config required source {env.template_url}/sshd_config
    /sftp/entrypoint.d/10-sftp-layout.sh from ./cfg/{name} key sftp-layout.sh mode 0755 required source {env.template_url}/sftp-layout.sh
    /sftp/authorized_keys/ from ./cfg/{name} key authorized_keys/*
    /mirror/sshd_config from ./cfg/{name} key mirror_sshd_config source {env.template_url}/mirror_sshd_config
    /mirror/entrypoint.d/10-mirror.sh from ./cfg/{name} key mirror.sh mode 0755 source {env.template_url}/mirror.sh
    /mirror/authorized_keys/ from ./cfg/{name} key mirror_keys/*

[container#0]
type = oci
image = ghcr.io/opensvc/pause
hostname = {name}
netns = none

# The sftp server, on port 22. Its accounts, name:uid:gid separated by
# commas, are the users key of the cfg: restart this container when it
# changes.
# sshd runs with at most 1024 open files: the container engines may give a
# container a limit of a billion, which the sftp sessions of this image spin
# on, closing every file descriptor of it, never answering.
[container#sftp]
type = oci
restart = 3
image = {env.sftp_image}
command = {env.sshd_command}
environment = SSH_USERS from ./cfg/{name} key users
volume_mounts = volume#1:/sftproot:/data:rw
    volume#1:/hostkeys:/etc/ssh/keys:rw
    volume#1:/sftp:/etc/sftp:ro
    volume#1:/sftp/authorized_keys:/etc/authorized_keys:ro
    volume#1:/sftp/entrypoint.d:/etc/entrypoint.d:ro
start_timeout = 1m

# Optional, disabled: a read-only endpoint on port 2222, one account, mirror,
# reading the files of every user, for a mirroring system to copy them to
# another site. See "Mirroring" in README.md.
[container#mirror]
disable = true
type = oci
restart = 3
image = {env.sftp_image}
command = {env.sshd_command}
volume_mounts = volume#1:/sftproot:/data:ro
    volume#1:/hostkeys:/etc/ssh/keys:ro
    volume#1:/mirror:/etc/sftp:ro
    volume#1:/mirror/authorized_keys:/etc/authorized_keys:ro
    volume#1:/mirror/entrypoint.d:/etc/entrypoint.d:ro
start_timeout = 1m

[env]
sftp_image = quay.io/panubo/sshd:1.10.0
sshd_command = /bin/sh -c "ulimit -n 1024 && exec /usr/sbin/sshd -D -e -f /etc/sftp/sshd_config"
template_url = https://raw.githubusercontent.com/opensvc/opensvc_templates/main/sftp
