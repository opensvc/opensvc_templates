# The one way into oc3, over https only: its web interface for the browsers,
# its api, and the feeder and the server of the agents, which listen on
# 127.0.0.1 alone. Installed as /etc/nginx/conf.d/oc3.conf in container#web,
# with nginx-headers beside it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    # The certificate and key of the sec, as `om <ns>/sec/<name> certificate create`
    # writes them, or your own.
    ssl_certificate     /etc/nginx/tls/certificate_chain;
    ssl_certificate_key /etc/nginx/tls/private_key;

    # The mozilla intermediate profile.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_vary on;
    gzip_types application/json;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    include /etc/nginx/conf.d/nginx-headers;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The api of the web interface.
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        client_max_body_size 32m;
        proxy_read_timeout 300s;
    }

    # The websocket of the messenger, which announces the changes.
    location /realtime {
        proxy_pass http://127.0.0.1:8889;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The agents, their collector.url pointing here: <url>/feeder and
    # <url>/server, the prefix left out.
    location /feeder/ {
        proxy_pass http://127.0.0.1:8080/;
        client_max_body_size 100m;
        proxy_read_timeout 300s;
    }

    location /server/ {
        proxy_pass http://127.0.0.1:8081/;
        client_max_body_size 100m;
        proxy_read_timeout 300s;
    }

    # The web interface: one file, kept gzipped, for every route of the
    # application. It brings its own Content-Security-Policy, in a <meta>:
    # sending none here, nor any stricter one, lets its inline script run. It
    # is checked again at each load, and taken whole at a new release.
    location / {
        root /usr/share/nginx/html;
        rewrite ^ /index.html break;
        gzip_static always;
        gunzip on;
        include /etc/nginx/conf.d/nginx-headers;
        add_header Cache-Control "no-cache" always;
    }
}
