[DEFAULT]
orchestrate = ha
netns = container#0
rm = true

# The subsets start in the order of their names: the database, then the
# migration of its schema, then the oc3 subsystems, all at once, then the web
# interface.
[subset#container:oc3]
parallel = true

[ip#1]
type = netns
network = default

[volume#1]
name = {name}-data
size = 4g
install = /db/ user 999 group 999
    /oc3/etc/config.yaml from ./cfg/{name} key config.yaml required source https://raw.githubusercontent.com/opensvc/opensvc_templates/main/oc3/config.yaml
    /initdb/01-schema.sql from ./cfg/{name} key schema.sql required source https://raw.githubusercontent.com/opensvc/collector/main/init/dbdump/schema.dump
    /initdb/02-data.sql from ./cfg/{name} key data.sql required source https://raw.githubusercontent.com/opensvc/collector/main/init/dbdump/data.dump
    /initdb/03-grants.sh from ./cfg/{name} key grants.sh mode 0755 required source https://raw.githubusercontent.com/opensvc/opensvc_templates/main/oc3/grants.sh
    /scripts/dbdump.sh from ./cfg/{name} key dbdump.sh mode 0755 required source https://raw.githubusercontent.com/opensvc/opensvc_templates/main/oc3/dbdump.sh
    /scripts/dbrestore.sh from ./cfg/{name} key dbrestore.sh mode 0755 required source https://raw.githubusercontent.com/opensvc/opensvc_templates/main/oc3/dbrestore.sh
    /web/conf.d/oc3.conf from ./cfg/{name} key nginx.conf required source https://raw.githubusercontent.com/opensvc/opensvc_templates/main/oc3/nginx.conf
    /web/conf.d/nginx-headers from ./cfg/{name} key nginx-headers required source https://raw.githubusercontent.com/opensvc/opensvc_templates/main/oc3/nginx-headers
    /web/html/index.html.gz from ./cfg/{name} key index.html.gz required source https://raw.githubusercontent.com/opensvc/oc3-frontend/gh-pages/latest/index.html.gz
    /web/tls/certificate_chain from ./sec/{name} key certificate_chain required
    /web/tls/private_key from ./sec/{name} key private_key required
    /dumps/
    /oc3/uploads/

[container#0]
type = oci
image = ghcr.io/opensvc/pause
hostname = {name}
netns = none

[container#db]
type = oci
restart = 3
image = {env.db_image}
command = --bind-address=127.0.0.1 --character-set-server=latin1 --collation-server=latin1_swedish_ci --skip-ssl
volume_mounts = volume#1:/db:/var/lib/mysql:rw
    volume#1:/initdb:/docker-entrypoint-initdb.d:ro
environment = {env.oc3_environment}
    MARIADB_ROOT_PASSWORD from ./sec/{name} key db_root_password source random
    MARIADB_AUTO_UPGRADE=1
start_timeout = 5m
stop_timeout = 10m
subset = data

[container#redis]
type = oci
restart = 3
image = {env.redis_image}
command = --bind 127.0.0.1
subset = data

[container#migrate]
type = oci
image = {env.oc3_image}
detach = false
command = db migrate --wait 5m
start_timeout = 10m
subset = data
volume_mounts = {env.oc3_mounts}
environment = {env.oc3_environment}

[container#feeder]
type = oci
restart = 3
image = {env.oc3_image}
command = feeder
subset = oc3
volume_mounts = {env.oc3_mounts}
environment = {env.oc3_environment}

[container#server]
type = oci
restart = 3
image = {env.oc3_image}
command = server
subset = oc3
volume_mounts = {env.oc3_mounts}
environment = {env.oc3_environment}

[container#worker-fast]
type = oci
restart = 3
image = {env.oc3_image}
command = worker --name fast
subset = oc3
volume_mounts = {env.oc3_mounts}
environment = {env.oc3_environment}

[container#worker-slow]
type = oci
restart = 3
image = {env.oc3_image}
command = worker --name slow
subset = oc3
volume_mounts = {env.oc3_mounts}
environment = {env.oc3_environment}

[container#scheduler]
type = oci
restart = 3
image = {env.oc3_image}
command = scheduler
subset = oc3
volume_mounts = {env.oc3_mounts}
environment = {env.oc3_environment}

[container#messenger]
type = oci
restart = 3
image = {env.oc3_image}
command = messenger
subset = oc3
volume_mounts = {env.oc3_mounts}
environment = {env.oc3_environment}

# The one way into oc3, https on port 443: the web interface, kept in the cfg
# as one gzipped file, its api, and the agents. nginx.conf says how.
[container#web]
type = oci
restart = 3
image = {env.web_image}
volume_mounts = volume#1:/web/conf.d:/etc/nginx/conf.d:ro
    volume#1:/web/html:/usr/share/nginx/html:ro
    volume#1:/web/tls:/etc/nginx/tls:ro
subset = web

# A dump of the databases a day, the last {env.dump_retention} kept in the
# volume, under /dumps.
[task#dbdump]
type = oci
image = {env.db_image}
volume_mounts = volume#1:/dumps:/dumps:rw
    volume#1:/scripts:/scripts:ro
environment = MYSQL_PWD from ./sec/{name} key db_root_password
    DUMP_RETENTION={env.dump_retention}
command = /scripts/dbdump.sh
run_requires = container#db(up)
schedule = 05:30-06:00@31
check = last_run

# Restores /dumps/restore.me.sql.gz, else the latest dump, the oc3 subsystems
# stopped: see the README.
[task#dbrestore]
type = oci
image = {env.db_image}
volume_mounts = volume#1:/dumps:/dumps:ro
    volume#1:/scripts:/scripts:ro
environment = MYSQL_PWD from ./sec/{name} key db_root_password
command = /scripts/dbrestore.sh
run_requires = container#db(up)
confirmation = true
check = last_run

[env]
oc3_environment = OC3_DB_PASSWORD from ./sec/{name} key db_password source random
oc3_mounts = volume#1:/oc3/etc:/etc/oc3:ro volume#1:/oc3/uploads:/oc3/uploads:rw
oc3_image = ghcr.io/opensvc/oc3:0.3
web_image = docker.io/nginx:1.30-alpine
db_image = docker.io/mariadb:12.3
redis_image = docker.io/redis:7.2-alpine
dump_retention = 3
