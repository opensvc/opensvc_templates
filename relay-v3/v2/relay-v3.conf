[DEFAULT]
nodes = *
orchestrate = ha

[volume#1]
type = shm
name = {name}
size = 1m
install = /config/users/ from ./sec/{name} key users/*

[ip#1]
type = netns
network = default
netns = container#0

[container#0]
image = ghcr.io/opensvc/pause
rm = true
hostname = {name}

[container#1]
image = forge.opensvc.com/opensvc/relay3:latest
rm = true
volume_mounts = volume#1:/config:/config:ro
netns = container#0
