[DEFAULT]
nodes = *
orchestrate = ha

# The configuration the relay reads at its start, installed from the sec of
# the same name in a memory volume: the users allowed to send their heartbeats
# to the relay, each key users/<name> holding the password of one. Nothing
# here needs keeping: the relay configures itself from it anew at each start.
[volume#1]
type = shm
name = {name}
size = 1m
install = /config/users/ from ./sec/{name} key users/*

# The address of the relay, drawn from the cluster network env.network names:
# a backend network for a relay the nodes of the cluster reach, a lan network
# of public addresses for a relay other clusters reach.
[ip#1]
type = netns
network = {env.network}
netns = container#0

[container#0]
image = ghcr.io/opensvc/pause
rm = true
hostname = {name}

[container#1]
image = {env.image}
rm = true
volume_mounts = volume#1:/config:/config:ro
netns = container#0

[env]
network = default
image = ghcr.io/opensvc/relay3:latest
