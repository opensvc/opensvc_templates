[DEFAULT]
nodes = {dnsnodes}
topology = flex
flex_min = {#nodes}
orchestrate = ha

# The configuration of the nameservers, rendered at each start: the networks
# file says, for each cluster network, its address range, whose clients the
# recursor answers, and its reverse zones, which the recursor forwards to the
# authoritative server, with the cluster zone.
[volume#1]
name = {name}
size = 1m
access = rwx
install = `
	/etc/server.template from ./cfg/{name} key server
	/etc/recursor.template from ./cfg/{name} key recursor
	/etc/networks from ./cfg/{name} key networks template
	/bin/configure from ./cfg/{name} key configure
`

[container#config]
type = oci
image = docker.io/busybox:1.36.1
rm = true
detach = false
volume_mounts = volume#1:/:/mnt:Z
entrypoint = /bin/sh
environment = DNS="{dns}" PORT={env.server_port} CLUSTERNAME={clustername} SOCK={dnsuxsock}
command = /mnt/bin/configure
start_timeout = 1m

[container#server]
type = oci
image = docker.io/powerdns/pdns-auth-51
netns = host
userns = host
rm = true
volume_mounts = {dnsuxsockd}:{dnsuxsockd}:rw volume#1:/etc/pdns.conf:/etc/pdns/pdns.conf:Z
command = --config-dir=/etc/pdns
run_args = --security-opt label=disable
start_timeout = 1m

[container#recursor]
type = oci
image = docker.io/powerdns/pdns-recursor-54
netns = host
userns = host
rm = true
user = root
privileged = true
volume_mounts = volume#1:/pdns-recursor/:/var/run/pdns-recursor:rw volume#1:/etc/recursor.conf:/etc/pdns/recursor.conf
command = --config-dir=/etc/pdns --enable-old-settings
start_timeout = 1m

[container#janitor]
type = oci
image = ghcr.io/opensvc/pdns_janitor:{dns_janitor_major}
netns = host
userns = host
rm = true
privileged = true
volume_mounts = volume#1:/:/var/run:rw {var}/lsnr:/var/run/lsnr:rw
environment = OPENSVC_RECURSOR_SOCK=/var/run/pdns-recursor/pdns_recursor.controlsocket
start_timeout = 1m

[env]
server_port = 5300
