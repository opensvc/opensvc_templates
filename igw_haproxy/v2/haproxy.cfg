# The head of the gateway configuration: what every route shares.
#
# Routes are added either here, in this key, or each in a key of its own
# under conf.d/ in the cfg, haproxy reading them all. A route serving a
# domain is a backend named after it: the https frontend sends a request to
# the backend named as the host it asks for, so a configlet holding only
# "backend www.example.com" routes www.example.com, and its certificate is
# obtained and renewed for it.

global
    log stdout format raw local0
    tune.lua.bool-sample-conversion normal
    lua-load /usr/local/etc/haproxy/acme-http01-webroot.lua
    # a reload waits no longer than this for the open connections to end
    hard-stop-after 30s

# the backends are named by their cluster dns names, resolved again as they move
resolvers clusterdns
    parse-resolv-conf
    accepted_payload_size 8192

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    # never fail on address resolution
    default-server init-addr last,libc,none

frontend http
    bind [::]:80 v4v6
    option forwardfor
    acl acme path_beg /.well-known/acme-challenge/
    http-request use-service lua.acme-http01 if METH_GET acme
    redirect scheme https code 301 if !acme

frontend https
    bind [::]:443 v4v6 ssl crt /usr/local/etc/haproxy/default.pem crt /usr/local/etc/haproxy/certs/ alpn h2,http/1.1
    option forwardfor
    # The backend named as the host asked, a host with no backend getting a
    # 404. Only a host shaped as a domain selects a backend this way: the
    # backends not named after a domain are reached by the rules naming them
    # only, whatever host a client sends.
    acl host_is_domain req.hdr(host),lower,word(1,:) -m reg ^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$
    use_backend %[req.hdr(host),lower,word(1,:)] if host_is_domain
    default_backend unknown_host

backend unknown_host
    http-request return status 404 content-type text/plain string "no route for this host"
