[DEFAULT]
nodes = *
orchestrate = ha

# The files haproxy reads, installed from the cfg and the sec of the same
# name, and the certificates of the domains from the secs named after it,
# anew on each start: nothing here needs keeping nor replicating. The sec of
# the same name is created with a self-signed certificate, the one haproxy
# presents to a client asking no domain of the routes.
[volume#1]
type = shm
name = {name}
size = 4m
user = 99
group = 99
install = `
	/haproxy/haproxy.cfg from ./cfg/{name} key haproxy.cfg signal HUP:container#1
	/haproxy/conf.d/
	/haproxy/conf.d/ from ./cfg/{name} key conf.d/* signal HUP:container#1
	/haproxy/acme-http01-webroot.lua from ./cfg/{name} key acme-http01-webroot.lua signal HUP:container#1
	/haproxy/default.pem from ./sec/{name} key fullpem signal HUP:container#1
	/haproxy/certs/
	/haproxy/certs/*.pem from ./sec/{name}-* key fullpem signal HUP:container#1
	/haproxy/acme-challenges/
`

[ip#1]
type = netns
network = {env.backend_network}
netns = container#0
shared = true

[ip#2]
type = netns
name = {env.public_addr}
netmask = {env.public_netmask}
gateway = {env.public_gateway}
dev = {env.public_dev}
mode = bridge
netns = container#0
shared = true

[container#0]
image = ghcr.io/opensvc/pause
rm = true
shared = true

[container#1]
image = {env.haproxy_image}
rm = true
environment = CLUSTERNAME={clustername} NAMESPACE={namespace}
# Read-only: only the agent writes the volume, its installs and the renewal
# of the certificate, which writes the challenge token as root, and a link
# haproxy planted there would lead elsewhere.
volume_mounts = `
	volume#1:/haproxy:/usr/local/etc/haproxy:ro
	volume#1:/haproxy/acme-challenges:/acme-challenges:ro
`
command = -W -db -f /usr/local/etc/haproxy/haproxy.cfg -f /usr/local/etc/haproxy/conf.d
netns = container#0
restart = 3
shared = true

# Obtains a certificate for each domain a route of conf.d/ serves, its file
# named after the domain, once the domain resolves to the public address,
# renews it, and deletes it with the route: when a route is added or removed,
# which installs the haproxy files again, and daily. The http frontend serves
# the challenge tokens.
[task#acme]
type = acme
secs = ./sec/{name}
directory = {env.acme_directory}
email = {env.acme_email}
domains_from = volume#1:/haproxy/conf.d/*.cfg
domains_to = ./sec/{name}-*
webroot = volume#1:/haproxy/acme-challenges
on = FileInstalled,rid=volume#1
pace = @10s
schedule = @1d
run_requires = container#1(up)

[env]
haproxy_image = docker.io/haproxy:3.2-alpine
acme_directory = letsencrypt
acme_email =
backend_network = default
public_addr =
public_netmask =
public_gateway =
public_dev =
