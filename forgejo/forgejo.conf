# Forgejo, a git forge, with its database and an actions runner, as one
# failover service. See README.md.
#
#   subset server: server pod, ip#1     subset worker: runner pod, ip#2
#   +-------------------------------+    +-------------------------------+
#   | 0pod     pause                |    | 4pod     pause                |
#   | 1db      127.0.0.1:5432       |    | 5dind    127.0.0.1:2375       |
#   | 2forgejo :3000 :22 <------------------ 6runner                    |
#   | 3init    one shot             |    |    +--> the jobs containers   |
#   +-------------------------------+    +-------------------------------+
#   volume#1 <name>-data (shared): /conf /data/{db,forgejo} /cache/{docker,runner}
#
# Two subsets, to act on a pod alone, with --subset server or --subset worker.
# volume#1 serves both, in no subset. The subsets start in the order of their
# names, server then worker, and the containers of a subset in the order of
# their names, which start with their rank: the pause container first.

[DEFAULT]
nodes = {clusternodes}
orchestrate = ha
netns = container#0pod
rm = true

# The address of the server pod, taken from the cluster network: published
# as server.<name>.<namespace>.svc.<clustername>.
[ip#1]
subset = server
type = netns
network = {env.network}

# The address of the runner pod, from the same network: published as
# runner.<name>.<namespace>.svc.<clustername>. The jobs go out by it.
[ip#2]
subset = worker
type = netns
netns = container#4pod
network = {env.network}

# Everything the service keeps, following it from node to node, in a volume
# shared between them:
# /conf/          installed from the cfg at each start: the init script, the
#                 runner script and the runner configuration
# /data/db/       the database, of container#1db
# /data/forgejo/  the data of the forge, of container#2forgejo: repositories,
#                 app.ini, lfs, ssh host keys
# /cache/docker/  the storage of container#5dind, the images of the jobs:
#                 dockerd sets its mode to 0710
# /cache/runner/  the home of container#6runner, run as 1000: the clones of
#                 the actions and the cache of the workflows
# What /data holds is what to back up. What /cache holds can be removed, the
# service stopped: it is fetched again.
[volume#1]
name = {name}-data
size = 10g
# From a pool shared between the nodes, a drbd one for example.
shared = true
install = /conf/
    /data/
    /data/db/
    /data/forgejo/
    /cache/
    /cache/docker/ mode 0710
    /cache/runner/ user 1000 group 1000 mode 0755
    /conf/forgejo-init.sh from ./cfg/{name} key forgejo-init.sh mode 0755 required source {env.template_url}/forgejo-init.sh
    /conf/runner.sh from ./cfg/{name} key runner.sh mode 0755 required source {env.template_url}/runner.sh
    /conf/runner-config.yml from ./cfg/{name} key runner-config.yml mode 0644 required source {env.template_url}/runner-config.yml

[container#0pod]
subset = server
type = oci
image = ghcr.io/opensvc/pause
hostname = server
netns = none

[container#4pod]
subset = worker
type = oci
image = ghcr.io/opensvc/pause
hostname = runner
netns = none

# The database, only listening on the loopback of the server pod. Its
# password is made at the first deploy. postgres needs time to write its
# last checkpoint on stop: the default stop_timeout, 10s, is too short.
[container#1db]
subset = server
type = oci
restart = 3
image = {env.db_image}
command = postgres -c listen_addresses=127.0.0.1
environment = POSTGRES_DB=forgejo
    POSTGRES_USER=forgejo
    POSTGRES_PASSWORD from ./sec/{name} key dbpassword source random
volume_mounts = volume#1:/data/db:/var/lib/postgresql:rw
stop_timeout = 2m

# The forge, on ports 3000 (web) and 22 (git over ssh). INSTALL_LOCK skips
# the web installer: container#3init makes the admin account.
[container#2forgejo]
subset = server
type = oci
restart = 3
image = {env.forgejo_image}
environment = USER_UID=1000
    USER_GID=1000
    FORGEJO__database__DB_TYPE=postgres
    FORGEJO__database__HOST=127.0.0.1:5432
    FORGEJO__database__NAME=forgejo
    FORGEJO__database__USER=forgejo
    FORGEJO__database__PASSWD from ./sec/{name} key dbpassword
    FORGEJO__server__DOMAIN=server.{fqdn}
    FORGEJO__server__SSH_DOMAIN=server.{fqdn}
    FORGEJO__server__ROOT_URL=http://server.{fqdn}:3000/
    FORGEJO__security__INSTALL_LOCK=true
    FORGEJO__service__DISABLE_REGISTRATION=true
volume_mounts = volume#1:/data/forgejo:/data:rw
    /etc/localtime:/etc/localtime:ro
stop_timeout = 1m

# One shot, at each start, once the forge answers: makes the admin account
# if missing, and registers the runner with the secret it shares with it.
[container#3init]
subset = server
type = oci
detach = false
tags = nostatus
image = {env.forgejo_image}
user = 1000:1000
entrypoint = /bin/sh
command = /conf/forgejo-init.sh
environment = ADMIN_USER={env.admin}
    ADMIN_EMAIL={env.admin}@server.{fqdn}
    RUNNER_NAME={name}
    ADMIN_PASSWORD from ./sec/{name} key adminpassword source random
    RUNNER_SECRET from ./sec/{name} key runner_secret source random
volume_mounts = volume#1:/data/forgejo:/data:rw
    volume#1:/conf:/conf:ro
start_timeout = 5m

# The docker engine of the jobs, only listening on the loopback of the
# runner pod: the jobs never see the engine of the node. Its storage is in
# volume#1: without it, the image would give a new anonymous volume to each
# start, which rm leaves behind.
[container#5dind]
subset = worker
type = oci
restart = 3
netns = container#4pod
privileged = true
image = {env.dind_image}
command = dockerd -H tcp://127.0.0.1:2375 --tls=false
volume_mounts = volume#1:/cache/docker:/var/lib/docker:rw
stop_timeout = 1m

# The actions runner: takes the jobs from the forge, runs them on
# container#5dind. runner.sh waits for both, then starts it. Its /data, the
# clones of the actions and the cache of the workflows, is in volume#1.
[container#6runner]
subset = worker
type = oci
restart = 3
netns = container#4pod
image = {env.runner_image}
entrypoint = /bin/sh
command = /etc/runner/runner.sh
environment = DOCKER_HOST=tcp://127.0.0.1:2375
    FORGEJO_URL=http://server.{fqdn}:3000
    RUNNER_SECRET from ./sec/{name} key runner_secret
volume_mounts = volume#1:/conf:/etc/runner:ro
    volume#1:/cache/runner:/data:rw
stop_timeout = 1m

[env]
network = default
admin = forgejo-admin
forgejo_image = data.forgejo.org/forgejo/forgejo:17.0.2
runner_image = data.forgejo.org/forgejo/runner:13.2.2
dind_image = docker.io/library/docker:29.10.0-dind
db_image = docker.io/library/postgres:18.7-alpine
template_url = https://raw.githubusercontent.com/opensvc/opensvc_templates/main/forgejo
